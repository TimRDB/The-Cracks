<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Cracks - Apartment</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preload" as="image" href="assets/title-screen-bg.png" />
  <link rel="preload" as="image" href="assets/player-sheet-keyed-v1.png" />
  <link rel="preload" as="image" href="assets/bedroom-wakeup-v1.png" />
  <link rel="preload" as="image" href="assets/alarm-closeup-v1.png" />
  <link rel="preload" as="image" href="assets/outside_bg.png" />
  <link rel="preload" as="image" href="assets/street_bg_counter_v2.png" />
  <link rel="preload" as="image" href="assets/street_doors_open.png" />
  <link rel="preload" as="image" href="assets/bluestar-interior-v2.png" />
  <link rel="preload" as="image" href="assets/bluestar-door-left-v2.png" />
  <link rel="preload" as="image" href="assets/bluestar-door-right-v2.png" />
  <link rel="preload" as="image" href="assets/lighting/bedroom-states-v14/bedroom-c0-l0-m0.png" />
  <link rel="preload" as="image" href="assets/lighting/hard-states-v7/living-c0-m0-b0-h0.png" />
  <link rel="preload" as="image" href="assets/lighting/hard-states-v7/bathroom-c0-m0.png" />
</head>
<body>
  <section id="titleScreen" class="title-screen" aria-label="The Cracks main menu">
    <div class="title-backdrop" aria-hidden="true"></div>
    <div class="title-content">
      <h1 class="game-title" data-text="The Cracks">The Cracks</h1>
      <nav class="title-menu" aria-label="Main menu">
        <button id="newGameBtn" class="title-choice">New Game</button>
        <button id="optionsBtn" class="title-choice" aria-haspopup="dialog" aria-controls="optionsDialog" aria-expanded="false">Options</button>
      </nav>
    </div>
    <div id="optionsDialog" class="options-overlay" role="dialog" aria-modal="true" aria-labelledby="optionsHeading" hidden>
      <div class="options-panel">
        <h2 id="optionsHeading">Options</h2>
        <div class="options-space" aria-hidden="true"></div>
        <button id="goBackBtn" class="options-choice">Go Back</button>
      </div>
    </div>
    <div class="title-fade" aria-hidden="true"></div>
  </section>
  <main id="game" aria-hidden="true" inert>
    <div id="sceneViewport">
      <section id="scene" class="curtains-closed" data-room="bedroom" aria-label="Bedroom">
        <div id="room-art" aria-hidden="true">
          <div id="room-background">
            <div id="room-background-a" class="room-background-layer is-visible"></div>
            <div id="room-background-b" class="room-background-layer"></div>
          </div>
          <div id="wakeup-bed" hidden></div>
          <div id="living-toaster">
            <div id="living-toaster-a" class="toaster-state-layer is-visible"></div>
            <div id="living-toaster-b" class="toaster-state-layer"></div>
          </div>
          <div id="curtains">
            <div class="curtain-panel curtain-left"></div>
            <div class="curtain-panel curtain-right"></div>
          </div>
          <div id="tv-screen"></div>
          <div id="living-tv"></div>
          <div id="doorway" class="hidden"><div id="door-face"><div id="door-surface"></div></div></div>
          <div id="bedroom-door-foreground"></div>
          <div id="street-laundry" class="street-door" aria-hidden="true"><div class="street-leaf"></div></div>
          <div id="street-bluestar" class="street-door" aria-hidden="true"><div class="street-leaf left"></div><div class="street-leaf right"></div></div>
        </div>
        <div id="alley-npc" aria-hidden="true"></div>
        <div id="statusText">Walk to</div>
        <div id="hotspots"></div>
        <div id="player" class="sprite" data-facing="down" aria-label="Player character">
          <div class="player-frame"></div>
        </div>
        <div id="foreground" aria-hidden="true">
          <div class="outside-car-foreground burgundy"></div>
          <div class="outside-car-foreground silver"></div>
          <div class="outside-car-foreground blue"></div>
        </div>
        <div id="messageBox" class="hidden" role="status" aria-live="polite"></div>
        <div id="scene-fade" aria-hidden="true"></div>
        <div id="alarm-closeup" hidden role="img" aria-label="Alarm clock ringing at 6:00"><div id="alarm-digits"></div></div>
        <div id="wakeup-fade" aria-hidden="true"></div>
        <button id="skip-wakeup" hidden>Skip intro</button>
      </section>
    </div>
    <section id="interface" aria-label="Game controls">
      <div id="verbs" aria-label="Action verbs">
        <button data-verb="walk">Walk to</button>
        <button data-verb="look">Look at</button>
        <button data-verb="open">Open</button>
        <button data-verb="close">Close</button>
        <button data-verb="use">Use</button>
        <button data-verb="talk">Talk to</button>
      </div>
      <div id="roomControls">
        <span id="roomLight">Curtains closed</span>
        <button id="curtainToggle" aria-controls="curtains" aria-expanded="false">Open curtains</button>
      </div>
      <div id="controls">
        <button id="saveBtn">Save</button>
        <button id="loadBtn">Load</button>
        <button id="resetBtn">Reset</button>
      </div>
    </section>
  </main>
  <div id="devTools" class="dev-overlay" role="dialog" aria-modal="true" aria-labelledby="devToolsHeading" hidden>
    <div class="dev-panel">
      <section id="devMenu" class="dev-screen">
        <h2 id="devToolsHeading">Developer Tools</h2>
        <p class="dev-paused">Game paused</p>
        <div class="dev-options">
          <button id="devSceneSelectBtn" class="dev-choice">Scene Select</button>
        </div>
        <button id="devBackBtn" class="dev-choice dev-back">Back</button>
      </section>
      <section id="devSceneSelect" class="dev-screen" aria-labelledby="devSceneHeading" hidden>
        <h2 id="devSceneHeading">Scene Select</h2>
        <div id="devSceneList" class="dev-options"></div>
        <button id="devSceneBackBtn" class="dev-choice dev-back">Back</button>
      </section>
    </div>
  </div>
  <script src="rooms.js"></script>
  <script src="outside.js"></script>
  <script src="street.js"></script>
  <script src="alley.js"></script>
  <script src="wakeup.js"></script>
  <script src="game.js"></script>
  <script src="devtools.js"></script>
</body>
</html>
